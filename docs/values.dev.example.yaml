# Example override values for dev
proxy:
  image:
    registry: harbor.localhost
    repository: mapache/keycloak-proxy-go
    tag: latest
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    className: posaidon-nginx
    hosts:
      - host: dev.mapache.local
        paths:
          - path: /
            pathType: Prefix
  env:
    KEYCLOAK_ISSUER_URL: "http://keycloak.localhost/realms/posaidon"
    KEYCLOAK_EXTERNAL_URL: "http://keycloak.localhost/realms/posaidon"
    KEYCLOAK_CLIENT_ID: "posaidon-proxy"
    KEYCLOAK_REDIRECT_URL: "http://dev.mapache.local/auth/callback"
    SESSION_SECURE: "false"
    SESSION_SAMESITE: "lax"
    DEBUG_LOGGING: "true"
  secretEnv:
    KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"
    SESSION_SECRET: "REPLACE_ME"

anythingllm:
  image:
    registry: harbor.localhost
    repository: mapache/anythingllm
    tag: latest
    pullPolicy: IfNotPresent
  env:
    SIMPLE_SSO_NO_LOGIN_REDIRECT: "http://dev.mapache.local/logged-out"
  persistence:
    storageClass: posaidon-ebs-sc

weaviate:
  weaviate:
    image:
      registry: harbor.localhost
      repo: posaidon/weaviate
      tag: "1.34.0"
      pullPolicy: IfNotPresent
    initContainers:
      sysctlInitContainer:
        image:
          registry: harbor.localhost
          repo: posaidon/alpine
          tag: latest
          pullPolicy: IfNotPresent
    persistence:
      storageClass: posaidon-ebs-sc
