nameOverride: ""
fullnameOverride: ""

image:
  registry: harbor.localhost
  repository: mapache/keycloak-proxy-go
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: false
  name: ""
  automount: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Init container to wait for AnythingLLM before starting proxy
initContainers:
  waitForAnythingllm:
    enabled: true
    image: busybox:1.36
    host: anythingllm
    port: 3001
    sleepSeconds: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

configMap:
  create: true
  name: ""

# Environment variables for the proxy
# IMPORTANT: Update Keycloak URLs for your environment
env:
  # REQUIRED: Configure these for your Keycloak instance
  KEYCLOAK_ISSUER_URL: ""      # e.g., https://keycloak.example.com/realms/myrealm
  KEYCLOAK_CLIENT_ID: ""       # e.g., my-client
  KEYCLOAK_REDIRECT_URL: ""    # e.g., https://app.example.com/auth/callback
  KEYCLOAK_EXTERNAL_URL: ""    # e.g., https://keycloak.example.com/realms/myrealm

# Secrets - set via --set or external secret
secretEnv:
  ANYLLM_API_KEY: ""
  KEYCLOAK_CLIENT_SECRET: ""
  SESSION_SECRET: ""

# Use existing secret instead of creating one
existingSecret: ""

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  nameOverride: ""
  hosts:
    - host: ""  # REQUIRED: Set your ingress hostname
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Startup probe - allows longer initialization time
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30  # 30 * 5s = 150s max startup time

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
