nameOverride: ""
fullnameOverride: ""

image:
  registry: harbor.localhost
  repository: mapache/keycloak-proxy-go
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

serviceAccount:
  create: false
  name: ""
  automount: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
# Optional: mount CA bundle for Keycloak TLS validation.
# Example:
# extraVolumes:
#   - name: keycloak-ca
#     secret:
#       secretName: keycloak-ca
# extraVolumeMounts:
#   - name: keycloak-ca
#     mountPath: /etc/ssl/keycloak
#     readOnly: true
extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Init container to wait for AnythingLLM before starting proxy
initContainers:
  waitForAnythingllm:
    enabled: true
    image: busybox:1.36
    host: anythingllm
    port: 3001
    sleepSeconds: 2
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi

configMap:
  create: true
  name: ""

# Environment variables for the proxy
# IMPORTANT: Update Keycloak URLs for your environment
  env:
    # REQUIRED: Configure these for your Keycloak instance
    KEYCLOAK_ISSUER_URL: ""      # e.g., https://keycloak.example.com/realms/myrealm
    KEYCLOAK_CLIENT_ID: ""       # e.g., my-client
    KEYCLOAK_REDIRECT_URL: ""    # e.g., https://app.example.com/auth/callback
    KEYCLOAK_EXTERNAL_URL: ""    # e.g., https://keycloak.example.com/realms/myrealm
    # TLS options for Keycloak (airgapped/PKI)
    # KEYCLOAK_CA_PATH: "/etc/ssl/keycloak/ca.pem"
    # KEYCLOAK_INSECURE_SKIP_VERIFY: "false"

# Secrets - set via --set or external secret
secretEnv:
  ANYLLM_API_KEY: ""
  KEYCLOAK_CLIENT_SECRET: ""
  SESSION_SECRET: ""

# Use existing secret instead of creating one
existingSecret: ""

ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  nameOverride: ""
  hosts:
    - host: ""  # REQUIRED: Set your ingress hostname
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Startup probe - allows longer initialization time
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30  # 30 * 5s = 150s max startup time

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# ===========================================
# ARGO ROLLOUTS CONFIGURATION
# ===========================================
# When enabled, creates a Rollout instead of a Deployment
# Requires Argo Rollouts controller installed in the cluster:
#   kubectl create namespace argo-rollouts
#   kubectl apply -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/latest/download/install.yaml
rollouts:
  enabled: false  # Backward compatible - disabled by default

  # Maximum number of pods that can be created above replicas during update
  maxSurge: 1
  # Maximum number of pods that can be unavailable during update
  maxUnavailable: 0

  # Canary deployment steps
  # Each step is executed in order, pausing between steps
  canarySteps:
    - setWeight: 10
    - pause: {duration: 2m}
    - setWeight: 25
    - pause: {duration: 2m}
    - setWeight: 50
    - pause: {duration: 5m}
    - setWeight: 75
    - pause: {duration: 5m}
    - setWeight: 100

  # Analysis configuration for canary validation
  # Analysis runs during canary deployment to validate health
  analysis:
    enabled: true
    startingStep: 1  # Start analysis after first canary step

    # Health check configuration
    healthCheck:
      interval: 30s
      count: 5
      failureLimit: 2

    # Readiness check configuration
    readinessCheck:
      interval: 30s
      count: 5
      failureLimit: 2

    # Error rate analysis (requires Prometheus metrics)
    errorRate:
      enabled: false
      interval: 60s
      count: 10
      threshold: 0.05  # 5% error rate threshold
      failureLimit: 3

    # Latency analysis (requires Prometheus metrics)
    latency:
      enabled: false
      interval: 60s
      count: 10
      threshold: 500  # 500ms p99 latency threshold
      failureLimit: 3

    # Prometheus address for metrics queries
    prometheus:
      address: http://prometheus:9090
