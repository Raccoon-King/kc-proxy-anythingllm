nameOverride: ""
fullnameOverride: ""

image:
  repository: semitechnologies/weaviate
  tag: "1.28.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

service:
  type: ClusterIP
  port: 8080
  grpcPort: 50051

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# Authentication - leave empty to disable
auth:
  apiKey: ""

# Environment variables
env:
  QUERY_DEFAULTS_LIMIT: "25"
  AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
  PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
  DEFAULT_VECTORIZER_MODULE: "none"
  ENABLE_MODULES: ""
  CLUSTER_HOSTNAME: "node1"

# Pod settings
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
