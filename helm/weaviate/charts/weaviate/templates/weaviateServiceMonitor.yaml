{{- if and .Values.env.PROMETHEUS_MONITORING_ENABLED .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "weaviate.fullname" . }}
  labels:
    name: {{ include "weaviate.fullname" . }}
    app: {{ include "weaviate.fullname" . }}
    app.kubernetes.io/name: {{ include "weaviate.fullname" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  jobLabel: {{ include "weaviate.fullname" . }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "weaviate.fullname" . }}
      app.kubernetes.io/managed-by: {{ .Release.Service }}
      monitoring: enabled
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  endpoints:
  - targetPort: metrics
    path: /metrics
    interval: {{ .Values.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
