proxy:
  fullnameOverride: anythingllm-stack-proxy
  existingSecret: anythingllm-proxy
  image:
    registry: harbor.localhost
    repository: mapache/keycloak-proxy-go
    tag: latest
  imagePullSecrets:
    - harbor-pull-secret
  ingress:
    enabled: false
  env:
    ACCESS_LOGGING: "true"
    ANYLLM_AUTO_CREATE: "false"
    ANYLLM_DEFAULT_ROLE: user
    ANYLLM_HTTP_TIMEOUT: 10s
    ANYLLM_RETRY_BACKOFF: 200ms
    ANYLLM_RETRY_MAX: "0"
    ANYLLM_URL: http://anythingllm-stack-anythingllm:3001
    DEBUG_HTTP: "false"
    DEBUG_LOGGING: "false"
    HEADER_CSP: ""
    HEADER_FRAME_OPTIONS: SAMEORIGIN
    HEADER_PERMISSIONS: geolocation=(), microphone=(), camera=()
    HEADER_REFERRER_POLICY: strict-origin-when-cross-origin
    IDLE_TIMEOUT: 60s
    KEYCLOAK_CLIENT_ID: mapache-client
    KEYCLOAK_EXTERNAL_URL: http://keycloak.localhost/realms/mapache
    KEYCLOAK_ISSUER_URL: http://keycloak-dev.auth:8080/realms/mapache
    KEYCLOAK_REDIRECT_URL: http://proxy.localhost/auth/callback
    MAX_HEADER_BYTES: "1048576"
    METRICS_ENABLED: "false"
    PORT: "8080"
    RATE_LIMIT_BURST: "0"
    RATE_LIMIT_PER_MIN: "0"
    READ_HEADER_TIMEOUT: 5s
    READ_TIMEOUT: 15s
    READINESS_CHECKS: "false"
    READINESS_TIMEOUT: 2s
    READINESS_URL: ""
    SECURITY_HEADERS: "true"
    SECURITY_LOGGING: "true"
    SESSION_HTTP_ONLY: "true"
    SESSION_MAX_AGE_DAYS: "7"
    SESSION_SAMESITE: lax
    SESSION_SECURE: "false"
    SHUTDOWN_TIMEOUT: 10s
    UPSTREAM_DIAL_TIMEOUT: 10s
    UPSTREAM_IDLE_TIMEOUT: 60s
    UPSTREAM_MAX_IDLE_CONNS: "100"
    UPSTREAM_MAX_IDLE_CONNS_PER_HOST: "10"
    UPSTREAM_RESPONSE_HEADER_TIMEOUT: 15s
    UPSTREAM_TLS_HANDSHAKE_TIMEOUT: 10s
    WRITE_TIMEOUT: 15s
  initContainers:
    waitForAnythingllm:
      host: anythingllm-stack-anythingllm

anythingllm:
  fullnameOverride: anythingllm-stack-anythingllm
  existingSecret: anythingllm
  image:
    registry: harbor.localhost
    repository: mapache/anythingllm
    tag: latest
  imagePullSecrets:
    - harbor-pull-secret
  ingress:
    enabled: true
    className: nginx
    annotations: {}
    hosts:
      - host: anythingllm.localhost
        paths:
          - path: /
            pathType: Prefix
    tls: []
  extraSecretRefs:
    - anythingllm-api-key
  persistence:
    storageClass: local-path
  env:
    SIMPLE_SSO_NO_LOGIN_REDIRECT: http://proxy.localhost/logged-out
    WEAVIATE_ENDPOINT: http://anythingllm-stack-weaviate:80
  initContainers:
    waitForWeaviate:
      host: anythingllm-stack-weaviate

weaviate:
  weaviate:
    fullnameOverride: anythingllm-stack-weaviate
    service:
      name: anythingllm-stack-weaviate
    grpcService:
      name: anythingllm-stack-weaviate-grpc
    clusterApiSecret:
      create: true
    persistence:
      storageClass: local-path
    image:
      registry: cr.weaviate.io
      repo: semitechnologies/weaviate
      tag: 1.34.0
      pullSecrets: []
    env:
      RAFT_JOIN: "anythingllm-stack-weaviate-0"
      RAFT_BOOTSTRAP_EXPECT: "1"
    initContainers:
      sysctlInitContainer:
        image:
          registry: harbor.localhost
          repo: posaidon/alpine
          tag: latest
